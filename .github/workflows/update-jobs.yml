name: Update Waikato MyMSD Jobs

on:
  schedule:
    # Runs daily at 18:00 UTC (7:00 AM NZDT / 6:00 AM NZST)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Fetch latest Waikato jobs
        run: python fetch_msd_jobs.py --docs

      - name: Commit updated Excel and JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/waikato_jobs.xlsx docs/jobs.json
          git diff --staged --quiet || git commit -m "Update Waikato MyMSD jobs ($(date -u +%Y-%m-%d))"
          git push
